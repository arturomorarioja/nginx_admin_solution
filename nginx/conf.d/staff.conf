upstream staff_app {
    server 127.0.0.1:7003;
}

server {
    listen 80;
    server_name staff.learn.local;

    access_log /var/log/nginx/staff.access.log main;
    error_log /var/log/nginx/staff.error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 502 503 504 /errors/502.html;

    location = /errors/403.html {
        root /srv/www;
        internal;
    }
    location = /errors/404.html {
        root /srv/www;
        internal;
    }
    location = /errors/502.html {
        root /srv/www;
        internal;
    }

    location /internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://staff_app;
    }

    location /settings/ {
        auth_basic "Staff settings";
        auth_basic_user_file /etc/nginx/auth/staff.htpasswd;
        proxy_pass http://staff_app;
    }

    location / {
        proxy_pass http://staff_app;
    }
}
