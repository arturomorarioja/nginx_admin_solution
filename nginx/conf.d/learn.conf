upstream learning_app {
    server 127.0.0.1:7001;
}

upstream certificate_service {
    server 127.0.0.1:7002;
}

server {
    listen 80;
    server_name learn.local;

    root /srv/www/public;
    index index.html;

    access_log /var/log/nginx/learn.access.log main;
    error_log /var/log/nginx/learn.error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 502 503 504 /errors/502.html;

    location = /errors/403.html {
        root /srv/www;
        internal;
    }
    location = /errors/404.html {
        root /srv/www;
        internal;
    }
    location = /errors/502.html {
        root /srv/www;
        internal;
    }

    location /assets/ {
        try_files $uri =404;
        autoindex off;
    }

    location /downloads/ {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    location = /courses {
        return 301 /courses/;
    }
    location /courses/ {
        proxy_pass http://learning_app;
    }

    location = /account {
        return 301 /account/;
    }
    location /account/ {
        proxy_pass http://learning_app;
    }

    location /certificates/ {
        proxy_pass http://certificate_service;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
